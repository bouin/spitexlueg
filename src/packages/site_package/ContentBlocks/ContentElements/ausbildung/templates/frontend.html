<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<section class="section section--ausbildung">
    <div class="section__inner">

        <f:comment><!-- Intro: title left, description right (same pattern as before) --></f:comment>
        <div class="intro">
            <f:if condition="{data.header}">
                <h2 class="section__title">{data.header}</h2>
            </f:if>
            <f:if condition="{data.bodytext}">
                <div class="richtext">
                    <f:format.html>{data.bodytext}</f:format.html>
                </div>
            </f:if>
        </div>

        <f:comment>
            Accordion — narrower than the intro (margin-inline: var(--inset)).
            Items open independently via app.js; colours cycle automatically.
        </f:comment>
        <f:if condition="{data.items}">
            <div class="accordion" data-accordion>
                <f:for each="{data.items}" as="item" iteration="it">
                    <div class="accordion__item">
                        <button type="button" class="accordion__header"
                                aria-expanded="false"
                                aria-controls="acc-{data.uid}-{it.index}"
                                data-accordion-toggle>
                            <span class="accordion__title">{item.title}</span>
                            <span class="accordion__icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                        </button>
                        <div class="accordion__panel" id="acc-{data.uid}-{it.index}" role="region">
                            <div class="accordion__content">
                                <div class="accordion__inner richtext">
                                    <f:format.html>{item.content}</f:format.html>
                                </div>
                            </div>
                        </div>
                    </div>
                </f:for>
            </div>
        </f:if>

    </div>
</section>

</html>
