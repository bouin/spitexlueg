<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<section class="section section--benefits" id="benefits">
    <div class="section__inner">

        <f:comment><!-- Intro: title left, description right --></f:comment>
        <div class="intro">
            <f:if condition="{data.header}">
                <h2 class="section__title"><f:transform.html><f:format.stripTags allowedTags="<br>">{data.header}</f:format.stripTags></f:transform.html></h2>
            </f:if>
            <f:if condition="{data.bodytext}">
                <div class="richtext">
                    <f:format.html>{data.bodytext}</f:format.html>
                </div>
            </f:if>
        </div>

        <f:if condition="{data.tiles}">
            <div class="benefits">
                <f:for each="{data.tiles}" as="tile" iteration="it">
                    <article class="tile tile--{tile.color}">

                        <f:if condition="{tile.icon.0}">
                            <span class="tile__icon">
                                <img src="{tile.icon.0.publicUrl}" alt="" aria-hidden="true">
                            </span>
                        </f:if>

                        <h3 class="tile__title">{tile.title}</h3>

                        <f:comment><!-- Reserved area: text is always in the layout, revealed on toggle --></f:comment>
                        <div class="tile__text richtext">
                            <f:format.html>{tile.text}</f:format.html>
                        </div>

                        <div class="tile__foot">
                            <button type="button" class="tile__button"
                                    data-tile-toggle
                                    aria-expanded="false"
                                    aria-label="Mehr erfahren">
                                <span class="tile__button-inner">
                                    <span class="tile__button-label">Mehr erfahren</span>
                                    <span class="tile__button-arrow" aria-hidden="true">
                                        <svg viewBox="0 0 40.14 29.64" style="width:1.15rem;height:auto;display:block" aria-hidden="true"><polygon points="25.32 0 23.91 1.41 36.31 13.82 0 13.82 0 15.82 36.31 15.82 23.91 28.23 25.32 29.64 40.14 14.82 25.32 0" fill="currentColor"/></svg>
                                    </span>
                                </span>
                            </button>
                        </div>

                    </article>
                </f:for>
            </div>
        </f:if>

    </div>
</section>

</html>
