<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    The document skeleton (doctype, html, head, body) is rendered by TYPO3's
    PageRenderer. This template only provides the body content. CSS/JS are
    included via TypoScript from Resources/Public/Assets/Dist/.
</f:comment>

<f:render partial="Header" arguments="{
    navigation: mainNavigation,
    languagenavigation: languagenavigation,
    media: media,
    siteRoot: siteRoot,
    data: data,
    site: site
}"/>

<main class="mx-auto max-w-6xl px-6 py-12">
    <f:render section="Main"/>
</main>

<footer class="mx-auto max-w-6xl px-6 py-10 border-t border-neutral-200 text-sm text-neutral-500">
    <p>&copy; <f:format.date format="Y">now</f:format.date> {site.configuration.websiteTitle}</p>
</footer>

</html>
