<!DOCTYPE html>
<html lang="{f:if(condition: '{site.language.twoLetterIsoCode}', then: '{site.language.twoLetterIsoCode}', else: 'de')}"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <header class="site-header">
        <a class="site-header__brand" href="{f:uri.page(pageUid: site.rootPageId)}">
            {site.configuration.websiteTitle}
        </a>
        <f:render partial="Navigation/Main" arguments="{navigation: mainNavigation}"/>
    </header>

    <main class="site-main">
        <f:render section="Main"/>
    </main>

    <footer class="site-footer">
        <p>&copy; <f:format.date format="Y">now</f:format.date> {site.configuration.websiteTitle}</p>
    </footer>
</body>
</html>
