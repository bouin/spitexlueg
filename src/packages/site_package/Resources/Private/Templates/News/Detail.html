<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
      data-namespace-typo3-fluid="true">

<section class="section section--stellen">
    <div class="section__inner">
        <div class="stellen-detail">

            <div class="stellen-detail__meta ">
                <f:link.page pageUid="1" class="stellen-detail__back" section="freie-stellen">
                    <svg viewBox="0 0 40.14 29.64" style="width:1.15rem;height:auto;display:block;transform:rotate(180deg)" aria-hidden="true"><polygon points="25.32 0 23.91 1.41 36.31 13.82 0 13.82 0 15.82 36.31 15.82 23.91 28.23 25.32 29.64 40.14 14.82 25.32 0" fill="currentColor"/></svg>
                    <span>Alle offenen Stellen</span>
                </f:link.page>

                <f:for each="{newsItem.categories}" as="category">
                    <span class="stellen-detail__tag">{category.title}</span>
                </f:for>
            </div>

            <h1 class="stellen-detail__title">{newsItem.title}</h1>

            <div class="stellen-detail__body richtext">
                <f:format.html>{newsItem.bodytext}</f:format.html>
            </div>

            <f:comment><!-- Bewerbungsformular: same pill as the list. Carries the job title
                 in data-stelle so the Powermail select can be pre-selected. No target yet. --></f:comment>
            <div class="stellen-detail__apply">
                <a class="stellen__link" data-stelle="{newsItem.title}"
                   href="/#stelle={newsItem.title -> f:format.urlencode()}">
                    <span class="stellen__link-label">Bewerbungsformular</span>
                    <span class="stellen__link-icon" aria-hidden="true">
                        <svg viewBox="0 0 40.14 29.64" style="width:1.15rem;height:auto;display:block;transform:rotate(90deg)" aria-hidden="true"><polygon points="25.32 0 23.91 1.41 36.31 13.82 0 13.82 0 15.82 36.31 15.82 23.91 28.23 25.32 29.64 40.14 14.82 25.32 0" fill="currentColor"/></svg>
                    </span>
                </a>
            </div>

        </div>
    </div>
</section>

</html>
