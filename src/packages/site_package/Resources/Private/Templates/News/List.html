<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
      data-namespace-typo3-fluid="true">

<section class="section section--stellen" id="freie-stellen">
    <div class="section__inner">

        <f:comment><!-- Intro: title left, description right — taken from the
             plugin content element's header + bodytext (shared pattern). --></f:comment>
        <div class="intro">
            <f:if condition="{contentObjectData.header}">
                <h2 class="section__title">
                    <f:transform.html><f:format.stripTags allowedTags="<br>">{contentObjectData.header}</f:format.stripTags></f:transform.html>
                </h2>
            </f:if>
            <f:if condition="{contentObjectData.bodytext}">
                <div class="richtext">
                    <f:format.html>{contentObjectData.bodytext}</f:format.html>
                </div>
            </f:if>
        </div>
    </div>

    <f:comment><!-- Job list on its own full-width band: blue background starts
         BELOW the intro (intro stays on white). --></f:comment>
    <f:if condition="{news}">
        <div class="stellen-band">
            <div class="section__inner">
                <ul class="stellen">
                    <f:for each="{news}" as="newsItem">
                        <li class="stellen__item">
                            <div class="stellen__body">
                            <f:comment><!-- Badge(s): every category assigned to this news in the
                                 backend (e.g. "Lehrstelle") renders as a pill. --></f:comment>
                            <f:for each="{newsItem.categories}" as="category">
                                <span class="stellen__tag">{category.title}</span>
                            </f:for>
                            <f:if condition="{newsItem.teaser}">
                                <p class="stellen__intro">{newsItem.teaser}</p>
                            </f:if>
                            <h3 class="stellen__title">{newsItem.title}</h3>
                        </div>

                        <div class="stellen__actions">
                            <f:link.page pageUid="{settings.detailPid}" class="stellen__link"
                                         additionalParams="{tx_news_pi1: {news: '{newsItem.uid}', controller: 'News', action: 'detail'}}">
                                <span class="stellen__link-label">Mehr erfahren</span>
                                <span class="stellen__link-icon" aria-hidden="true">
                                    <svg viewBox="0 0 40.14 29.64" style="width:1.15rem;height:auto;display:block" aria-hidden="true"><polygon points="25.32 0 23.91 1.41 36.31 13.82 0 13.82 0 15.82 36.31 15.82 23.91 28.23 25.32 29.64 40.14 14.82 25.32 0" fill="currentColor"/></svg>
                                </span>
                            </f:link.page>

                            <f:comment><!-- Bewerbungsformular: same pill, down arrow. No target yet. --></f:comment>
                            <a class="stellen__link" data-stelle="{newsItem.title}"
                               href="/#stelle={newsItem.title -> f:format.urlencode()}">
                                <span class="stellen__link-label">Bewerbungsformular</span>
                                <span class="stellen__link-icon" aria-hidden="true">
                                    <svg viewBox="0 0 40.14 29.64" style="width:1.15rem;height:auto;display:block;transform:rotate(90deg)" aria-hidden="true"><polygon points="25.32 0 23.91 1.41 36.31 13.82 0 13.82 0 15.82 36.31 15.82 23.91 28.23 25.32 29.64 40.14 14.82 25.32 0" fill="currentColor"/></svg>
                                </span>
                            </a>
                        </div>
                        </li>
                    </f:for>
                </ul>
            </div>
        </div>
    </f:if>
</section>

</html>
