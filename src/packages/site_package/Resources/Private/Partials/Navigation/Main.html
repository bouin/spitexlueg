<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{navigation}">
    <nav class="main-nav" aria-label="Main navigation">
        <ul class="flex gap-5 list-none m-0 p-0">
            <f:for each="{navigation}" as="item">
                <li class="relative">
                    <a href="{item.link}" target="{item.target}"
                       class="no-underline {f:if(condition: '{item.active}', then: 'text-brand', else: 'text-inherit')} hover:text-brand">{item.title}</a>
                    <f:if condition="{item.children}">
                        <ul class="flex flex-col gap-2 list-none m-0 mt-2 p-0">
                            <f:for each="{item.children}" as="child">
                                <li>
                                    <a href="{child.link}" target="{child.target}"
                                       class="no-underline text-sm {f:if(condition: '{child.active}', then: 'text-brand', else: 'text-neutral-600')} hover:text-brand">{child.title}</a>
                                </li>
                            </f:for>
                        </ul>
                    </f:if>
                </li>
            </f:for>
        </ul>
    </nav>
</f:if>

</html>
