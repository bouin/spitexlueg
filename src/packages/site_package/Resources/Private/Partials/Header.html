<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment><!-- Site-wide hero image: root page "Media" field, resolved to a URL for background-image --></f:comment>
<f:variable name="heroUrl"><f:if condition="{heroImage}"><f:uri.image image="{heroImage}" maxWidth="2400"/></f:if></f:variable>

<header class="site-header">

    <f:if condition="{heroUrl}">
        <f:then><div class="hero" style="background-image: url('{heroUrl}');"></f:then>
        <f:else><div class="hero"></f:else>
    </f:if>

        <a href="#freie-stellen" class="hero__badge">Freie<br>Stellen</a>

        <div class="hero__inner">
            <h1 class="hero__title">Chum zu üs<br>ids Team</h1>
        </div>
    </div>

    <div class="navbar">
        <nav class="pill-nav" aria-label="Kampagnen-Navigation">
            <a class="pill-nav__link" href="#podcasts">Podcasts</a>
            <a class="pill-nav__link" href="#freie-stellen">Freie Stellen</a>
            <a class="pill-nav__link" href="#benefits">Benefits</a>
            <a class="pill-nav__link" href="#bewerben">Direkt bewerben</a>
            <a class="pill-nav__link" href="#standorte">Standorte Spitex Region Lueg</a>
        </nav>

        <a class="brand" href="{f:uri.page(pageUid: site.rootPageId)}">
            <img class="brand__logo"
                 src="{f:uri.resource(path: 'Images/spitex-region-lueg.svg', extensionName: 'SitePackage')}"
                 alt="Spitex Region Lueg"
                 width="260" height="76">
        </a>
    </div>

</header>

</html>
