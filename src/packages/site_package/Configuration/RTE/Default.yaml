# Lueg RTE / CKEditor preset.
# Imports TYPO3's default processing + editor base, then customises the toolbar.
imports:
  - resource: "EXT:rte_ckeditor/Configuration/RTE/Processing.yaml"
  - resource: "EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml"
  - resource: "EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml"

editor:
  config:
    # Visible toolbar. Use '|' for a separator and '-' for a line break.
    # NOTE: "heading" is the block-format dropdown (Paragraph / Überschrift 2…).
    # Without it the editor gives no way to see or set whether a line is a
    # paragraph or a heading — which is exactly what we want available here.
    toolbar:
      items:
        - undo
        - redo
        - "|"
        - heading
        - style
        - "|"
        - bold
        - italic
        - underline
        - strikethrough
        - subscript
        - superscript
        - "|"
        - link
        - "|"
        - bulletedList
        - numberedList
        - blockQuote
        - alignment
        - "|"
        - indent
        - outdent
        - "|"
        - insertTable
        - horizontalLine
        - specialCharacters
        - "|"
        - findAndReplace
        - removeFormat
        - "|"
        - sourceEditing

    # Block/paragraph formats shown in the "heading" dropdown. Each maps to its
    # real HTML tag, so the editor label matches the output (p, h1, h2, h3, h4).
    heading:
      options:
        - { model: "paragraph", title: "Paragraph" }
        - { model: "heading1", view: "h1", title: "Überschrift 1 (H1)" }
        - { model: "heading2", view: "h2", title: "Überschrift 2 (H2)" }
        - { model: "heading3", view: "h3", title: "Überschrift 3 (H3)" }
        - { model: "heading4", view: "h4", title: "Überschrift 4 (H4)" }

    # Extra inline styles available in the "style" dropdown (next to "heading").
    style:
      definitions:
        - name: "Small text"
          element: "p"
          classes:
            - "text-small"

    # Only allow safe, semantic links.
    link:
      defaultProtocol: "https://"

    # Basic table handling.
    table:
      contentToolbar:
        - tableColumn
        - tableRow
        - mergeTableCells
        - toggleTableCaption
